[pytest]
addopts = -q --maxfail=1
testpaths = tests
cache_dir = .test_artifacts/pytest_cache
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = __pycache__ koapys_openAPI koapys_test .venv .venv64 .pytest_cache .git .test_artifacts
markers =
    regression: marks tests as part of the regression suite (deselect with '-m "not regression"')
